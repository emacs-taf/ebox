[package]
name = "ebox-native-reflow"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "ebox_native_reflow"
crate-type = ["cdylib"]

[dependencies]
etaf-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
